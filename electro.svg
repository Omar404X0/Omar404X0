ill-opacity="0.13" stroke="#F59E0B" stroke-opacity="0.6"/><g transform="translate(62 346)"><circle r="8" fill="none" stroke="#F59E0B" stroke-width="1.6"/><path d="M0,-8 A8,8 0 0 1 0,8 Z" fill="#F59E0B"/></g><text x="96" y="348" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#F0F6FC">Polished experience</text><text x="96" y="370" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#8B949E" xml:space="preserve">Dark/light themes · instant search (Ctrl + K) · fully responsive</text></g>
