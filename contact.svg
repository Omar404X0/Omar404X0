<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Omar Elmallah - Reach Out & Connect">
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1c1043" />
    </linearGradient>
    <linearGradient id="title_gradient" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="reflect">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#8B5CF6" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="stroke_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="value_gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#E6EDF3" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 64px; font-weight: 800; letter-spacing: -1px; fill: url(#title_gradient); }
      .terminal_text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace; font-size: 19px; }
      .key { fill: #22D3EE; }
      .value { fill: url(#value_gradient); }
      .pulsing_light { fill: #22D3EE; }
    </style>
  </defs>

  <!-- Background and Grid -->
  <rect width="1200" height="340" fill="url(#bg_gradient)" />
  <rect width="1200" height="340" fill="none" stroke="url(#stroke_gradient)" stroke-width="2" rx="16" ry="16" />

  <!-- Title -->
  <text x="70" y="110" class="title">REACH OUT &amp; CONNECT</text>
  
  <!-- Terminal Interface for Contacts -->
  <g transform="translate(660 70)">
    <rect width="470" height="210" rx="14" fill="#0D1117" fill-opacity="0.9" stroke="#7C3AED" stroke-opacity="0.6" />
    <circle cx="22" cy="22" r="5.5" fill="#FF5F56" />
    <circle cx="42" cy="22" r="5.5" fill="#FFBD2E" />
    <circle cx="62" cy="22" r="5.5" fill="#27C93F" />
    <text x="448" y="26" text-anchor="end" class="terminal_text" fill="#8B949E" font-size="12">contacts.terminal</text>
    
    <g transform="translate(22 70)" class="terminal_text">
      <!-- Email Row -->
      <g>
        <path d="M1 1h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H1a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2zm0 2v10h16V3L9 8 1 3z" fill="#22D3EE" transform="translate(0 2)" scale="1.1" />
        <text x="35" y="19"><tspan class="key">email</tspan><tspan fill="#E6EDF3">: </tspan><tspan class="value">hello@omarel.ts</tspan></text>
      </g>
      <!-- LinkedIn Row -->
      <g transform="translate(0 35)">
        <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" fill="#22D3EE" transform="translate(0 2)" scale="1.1" />
        <text x="35" y="19"><tspan class="key">linkedin</tspan><tspan fill="#E6EDF3">: </tspan><tspan class="value">/in/OmarElmallah</tspan></text>
      </g>
      <!-- Telegram Row -->
      <g transform="translate(0 70)">
        <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm-2.486 16.516c-.347.375-.688.423-.815.394-.094-.022-.213-.131-.213-.131 0 0-4.321-3.664-5.264-4.526-.35-.31-.595-.595-.595-1.122s.475-.98.98-1.218c.505-.238 10.428-4.516 11.211-4.819.539-.208.99-.214 1.393-.119s.714.471.8.847c.101.44-.012 1.077-.168 1.631-.156.554-1.284 5.319-1.39 5.869-.143.74-.468 1.082-1 1.082-.533 0-.964-.342-.964-.342l-2.607-1.928 2.373-2.126.04-.04.03-.03-.13-.13-.162-.162z" fill="#22D3EE" transform="translate(0 2)" scale="1.1" />
        <text x="35" y="19"><tspan class="key">telegram</tspan><tspan fill="#E6EDF3">: </tspan><tspan class="value">@OmarEl</tspan></text>
      </g>
       <!-- Discord Row -->
      <g transform="translate(0 105)">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037 19.736 19.736 0 0 0-4.885 1.515.069.069 0 0 0-.032.027C.533 9.048-.32 13.572.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.006 14.006 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.125-.094.249-.192.37-.292a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.1.246.198.372.292a.077.077 0 0 1-.006.128 12.51 12.51 0 0 1-1.873.892.076.076 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.085 2.157 2.419 0 1.333-.955 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.085 2.157 2.419 0 1.333-.946 2.419-2.157 2.419z" fill="#22D3EE" transform="translate(0 2)" scale="1.1" />
        <text x="35" y="19"><tspan class="key">discord</tspan><tspan fill="#E6EDF3">: </tspan><tspan class="value">OmarEl#1234</tspan></text>
      </g>
    </g>
  </g>
  
  <!-- "AVAILABLE FOR ROLES" Capsule -->
  <g transform="translate(70 262)">
    <rect width="210" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.55" />
    <circle cx="18" cy="17" r="4" class="pulsing_light">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="22" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#E6EDF3">AVAILABLE FOR ROLES</text>
  </g>

</svg>
