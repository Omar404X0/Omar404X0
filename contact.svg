<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1c1043" />
    </linearGradient>
    <linearGradient id="title_gradient" x1="0%" y1="0%" x2="100%" y2="0%" spreadMethod="reflect">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#8B5CF6" />
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="stroke_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="value_gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#E6EDF3" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 42px; font-weight: 800; fill: url(#title_gradient); }
      .terminal_text { font-family: monospace; font-size: 15px; }
      .key { fill: #22D3EE; }
      .value { fill: url(#value_gradient); }
    </style>
  </defs>

  <!-- Background and Border with Fade-in Animation -->
  <rect width="1200" height="340" fill="url(#bg_gradient)" rx="16">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite" />
  </rect>
  <rect width="1200" height="340" fill="none" stroke="url(#stroke_gradient)" stroke-width="2" rx="16" />

  <!-- Animated Title (Two lines to fit perfectly) -->
  <g transform="translate(70, 95)">
    <text class="title">
      <tspan x="0" y="0">REACH OUT &</tspan>
      <tspan x="0" y="52">CONNECT</tspan>
    </text>
  </g>
  
  <!-- Terminal Box with Floating Animation -->
  <g transform="translate(580, 65)">
    <animateTransform attributeName="transform" type="translate" values="580 67;580 63;580 67" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
    
    <rect width="550" height="210" rx="12" fill="#0D1117" stroke="#7C3AED" stroke-opacity="0.6" />
    <circle cx="25" cy="20" r="5" fill="#FF5F56" />
    <circle cx="45" cy="20" r="5" fill="#FFBD2E" />
    <circle cx="65" cy="20" r="5" fill="#27C93F" />
    <text x="530" y="24" text-anchor="end" fill="#8B949E" font-family="monospace" font-size="12">contacts.ts</text>
    
    <g transform="translate(25, 60)" class="terminal_text">
      <!-- Email -->
      <text x="0" y="0"><tspan class="key">email</tspan><tspan fill="#E6EDF3">: </tspan><tspan class="value">elmallahomar24@gmail.com</tspan></text>
      <!-- LinkedIn -->
      <text x="0" y="32"><tspan class="key">linkedin</tspan><tspan fill="#E6EDF3">: </tspan><tspan class="value">/in/omar-elmallah</tspan></text>
      <!-- GitHub -->
      <text x="0" y="64"><tspan class="key">github</tspan><tspan fill="#E6EDF3">: </tspan><tspan class="value">Omar404X0</tspan></text>
      <!-- Location -->
      <text x="0" y="96"><tspan class="key">location</tspan><tspan fill="#E6EDF3">: </tspan><tspan class="value">Cairo, Egypt</tspan></text>
    </g>
  </g>
  
  <!-- Status Capsule with Pulsing Animation -->
  <g transform="translate(70, 245)">
    <rect width="210" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#22D3EE" stroke-opacity="0.55" />
    <circle cx="20" cy="17" r="4" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#E6EDF3">AVAILABLE FOR ROLES</text>
  </g>
</svg>